version: '3.8'

networks:
  plugn-network:
    driver: bridge

services:

  app:
    build:
      context: .
      dockerfile: ./Dockerfile-nginx-prod
    container_name: plugn-backend-prod
    #command:
    #  - /bin/sh
    #  - -c
    #  - |
    #    sleep 5 && \
    #    ./init --env=Dev-Server --overwrite=All && \
    #    ./yii migrate && \
    #    sleep 1 && \
    #    ln -s /etc/nginx/sites-available/basic.conf /etc/nginx/sites-enabled/ && \
    #    service nginx restart  && \
    #    tail -f /dev/null  # Keep container running
    ports:
      - "80:80" #app endpoint
    depends_on:
      redis:
        condition: service_healthy
      #- mysql
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80); if (!$$s) exit(1); fclose($$s);'"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 90s
    networks:
      - plugn-network

  redis:
    image: redis:6.2.3
    ports:
      #- "7777:7777"
      - "6379:6379"
    networks:
      - plugn-network
   # command:
   #   - redis-server --port 7777
    volumes:
    - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  redis-data:
