version: '3.8'

networks:
  plugn-network:
    driver: bridge

services:

  app:
    build:
      context: .
      dockerfile: ./Dockerfile-nginx-prod
    container_name: plugn-backend-prod
    ports:
      - "80:80" #app endpoint
    depends_on:
      redis:
        condition: service_healthy
      #- mysql
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: backend.plugn.io' http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - plugn-network

  redis:
    image: redis:6.2.3
    ports:
      #- "7777:7777"
      - "6379:6379"
    networks:
      - plugn-network
   # command:
   #   - redis-server --port 7777
    volumes:
    - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  redis-data:
